<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Ways 5x5 - Free Spin Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f051a, #2e0854, #0f172a);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 5px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .slot-container {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.9);
            border: 3px solid #ec4899;
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(236, 72, 153, 0.3);
            backdrop-filter: blur(10px);
        }
        h1 { color: #f472b6; font-size: 20px; margin: 3px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .info-panel {
            display: flex;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.8);
            padding: 6px 10px;
            border-radius: 8px;
            margin: 8px 0;
            border: 1px solid #db2777;
            font-size: 12px;
        }
        .multiplier-badge {
            background: #db2777;
            color: #fff;
            padding: 2px 6px;
            border-radius: 5px;
            font-weight: bold;
        }
        /* Grid Slot 5x5 (25 Kotak) */
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background: #030712;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #be185d;
            margin: 10px 0;
        }
        .tile {
            background: linear-gradient(145deg, #fdfbf7, #cbd5e1);
            color: #1e293b;
            font-size: 24px;
            padding: 10px 0;
            border-radius: 6px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.8), 0 2px 4px rgba(0,0,0,0.4);
            border: 1.5px solid #94a3b8;
            transition: transform 0.1s;
        }
        /* Ubin Emas */
        .tile.gold {
            background: linear-gradient(145deg, #fef08a, #eab308);
            border-color: #ca8a04;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.8);
        }
        /* Simbol Scatter Khusus (Amplop Merah) */
        .tile.scatter {
            background: linear-gradient(145deg, #fee2e2, #ef4444);
            border-color: #dc2626;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
        }
        button.spin-btn {
            background: linear-gradient(135deg, #ec4899, #9d174d);
            color: white;
            border: 2px solid #fbcfe8;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button.spin-btn:active { transform: scale(0.96); }
        .log-result {
            margin-top: 8px;
            font-size: 12px;
            color: #38bdf8;
            min-height: 30px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="slot-container">
        <h1>🀄 MAHJONG WAYS 5X5 FREE SPINS</h1>
        <div style="font-size: 10px; color: #94a3b8; margin-bottom: 3px;">Bandar Mode: Strict RTP + Free Spin Bonus</div>

        <div class="info-panel">
            <div>Saldo: <span id="userBalance" style="color: #4ade80; font-weight: bold;">Rp 50.000</span></div>
            <div>Free Spin: <span id="freeSpinCount" style="color: #60a5fa; font-weight: bold;">0</span></div>
            <div>Multi: <span id="multiplier" class="multiplier-badge">1x</span></div>
        </div>

        <!-- Grid Slot 5x5 -->
        <div class="slot-grid" id="slotGrid">
            <script>
                let defHtml = '';
                for(let i=0; i<25; i++) defHtml += '<div class="tile">🀄</div>';
                document.write(defHtml);
            </script>
        </div>

        <button class="spin-btn" id="spinButton" onclick="spinSlot()">PUTAR (BET Rp 10.000)</button>

        <div class="log-result" id="logResult">
            Dapatkan 3 Scatter (🧧) untuk memicu 10x Free Spin & Perkalian 2x!
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentBalance = 50000;
        let currentMultiplier = 1;
        let freeSpinsLeft = 0;

        const symbols = ["🀄", "🐉", "🀫", "🀀", "🀁", "🀂", "🀃", "🀄", "🐉"];
        const scatterSymbol = "🧧";

        function spinSlot() {
            const bet = 10000;
            const logEl = document.getElementById('logResult');
            const balanceEl = document.getElementById('userBalance');
            const gridEl = document.getElementById('slotGrid');
            const btnEl = document.getElementById('spinButton');

            let isFreeSpinActive = freeSpinsLeft > 0;

            // Jika bukan mode free spin, potong saldo
            if (!isFreeSpinActive && currentBalance < bet) {
                logEl.innerHTML = "❌ Saldo tidak cukup, bos! Yuk top-up dulu.";
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            if (isFreeSpinActive) {
                freeSpinsLeft--;
                document.getElementById('freeSpinCount').innerText = freeSpinsLeft;
                btnEl.innerText = `PUTAR GRATIS (${freeSpinsLeft})`;
                logEl.innerHTML = `🎁 <b>FREE SPIN BERJALAN!</b> Sisa putaran: ${freeSpinsLeft}`;
            } else {
                currentBalance -= bet;
                balanceEl.innerText = "Rp " + currentBalance.toLocaleString('id-ID');
                logEl.innerHTML = "🔄 Mengocok 25 ubin di meja bandar...";
            }

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            let counter = 0;
            let spinInterval = setInterval(() => {
                let htmlContent = '';
                for(let i=0; i<25; i++) {
                    let randSym = symbols[Math.floor(Math.random() * symbols.length)];
                    htmlContent += `<div class="tile">${randSym}</div>`;
                }
                gridEl.innerHTML = htmlContent;
                counter++;

                if(counter > 7) {
                    clearInterval(spinInterval);
                    finalizeSpin(isFreeSpinActive);
                }
            }, 70);
        }

        function finalizeSpin(isFreeSpinActive) {
            const logEl = document.getElementById('logResult');
            const balanceEl = document.getElementById('userBalance');
            const gridEl = document.getElementById('slotGrid');
            const btnEl = document.getElementById('spinButton');

            let randRoll = Math.random();
            let reward = 0;
            let message = "";
            let tileClasses = [];

            for(let i=0; i<25; i++) {
                // Peluang scatter (dibuat agak jarang agar eksklusif)
                let isScatter = Math.random() < 0.05;
                let sym = isScatter ? scatterSymbol : symbols[Math.floor(Math.random() * symbols.length)];
                let isGold = (!isScatter && Math.random() < 0.15) ? 'gold' : '';
                let cssClass = isScatter ? 'scatter' : isGold;
                tileClasses.push({sym, cssClass});
            }

            // Hitung jumlah scatter yang muncul di grid
            let scattersFound = tileClasses.filter(t => t.sym === scatterSymbol).length;

            // JIKA DAPAT 3 SCATTER ATAU LEBIH -> PICU 10x FREE SPIN + PERKALIAN 2x
            if (scattersFound >= 3) {
                freeSpinsLeft += 10;
                currentMultiplier *= 2; // Perkalian dilipat ganda 2x
                document.getElementById('freeSpinCount').innerText = freeSpinsLeft;
                document.getElementById('multiplier').innerText = currentMultiplier + "x";
                
                message = `🎉 JACKPOT SCATTER! +10x Free Spin & Perkalian Naik jadi ${currentMultiplier}x!`;
                reward = 0;
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                // Logika RTP normal / saat Free Spin
                // Jika sedang Free Spin, peluang menang dinaikkan sedikit agar pemain senang
                let winChanceMultiplier = isFreeSpinActive ? 2.5 : 1; 

                if (randRoll < (0.04 * winChanceMultiplier)) {
                    reward = 25000 * currentMultiplier;
                    message = `✨ Kemenangan Besar di Free Spin! Multiplier ${currentMultiplier}x`;
                } else if (randRoll < (0.20 * winChanceMultiplier)) {
                    reward = 10000 * currentMultiplier;
                    message = `🪙 Kemenangan Kombinasi Ubin Emas!`;
                } else {
                    reward = 0;
                    message = isFreeSpinActive ? `😢 Putaran gratis zonk. Lanjut!` : `💀 Rungkad! Saldo masuk ke bandar.`;
                }
            }

            currentBalance += reward;
            balanceEl.innerText = "Rp " + currentBalance.toLocaleString('id-ID');

            if (freeSpinsLeft === 0) {
                btnEl.innerText = "PUTAR (BET Rp 10.000)";
            }

            if (reward > 0) {
                logEl.innerHTML = `<b>${message}</b><br><span style="color: #4ade80;">+Rp ${reward.toLocaleString('id-ID')}</span>`;
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                logEl.innerHTML = `<span style="color: #f87171;">${message}</span>`;
            }

            // Render hasil akhir ke grid 5x5
            let finalHtml = '';
            for(let t of tileClasses) {
                finalHtml += `<div class="tile ${t.cssClass}">${t.sym}</div>`;
            }
            gridEl.innerHTML = finalHtml;
        }
    </script>
</body>
</html>
