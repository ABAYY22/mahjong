<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Ways 5x5 - MongoDB Connected</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f051a, #2e0854, #0f172a);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 5px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .slot-container {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.9);
            border: 3px solid #ec4899;
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(236, 72, 153, 0.3);
            backdrop-filter: blur(10px);
        }
        h1 { color: #f472b6; font-size: 19px; margin: 3px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .info-panel {
            display: flex;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.8);
            padding: 6px 10px;
            border-radius: 8px;
            margin: 6px 0;
            border: 1px solid #db2777;
            font-size: 12px;
        }
        .multiplier-badge {
            background: #db2777;
            color: #fff;
            padding: 2px 6px;
            border-radius: 5px;
            font-weight: bold;
        }
        .bet-control-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.9);
            padding: 6px 10px;
            border-radius: 8px;
            margin: 8px 0;
            border: 1px solid #475569;
        }
        .bet-btn-pm {
            background: linear-gradient(135deg, #475569, #1e293b);
            color: white;
            border: 1px solid #94a3b8;
            width: 38px;
            height: 34px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .bet-btn-pm:active { transform: scale(0.92); background: #db2777; }
        .bet-display {
            font-size: 14px;
            font-weight: bold;
            color: #facc15;
        }
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background: #030712;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #be185d;
            margin: 8px 0;
        }
        .tile {
            background: linear-gradient(145deg, #fdfbf7, #cbd5e1);
            color: #1e293b;
            font-size: 24px;
            padding: 10px 0;
            border-radius: 6px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.8), 0 2px 4px rgba(0,0,0,0.4);
            border: 1.5px solid #94a3b8;
        }
        .tile.gold {
            background: linear-gradient(145deg, #fef08a, #eab308);
            border-color: #ca8a04;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.8);
        }
        .tile.scatter {
            background: linear-gradient(145deg, #fee2e2, #ef4444);
            border-color: #dc2626;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
        }
        button.spin-btn {
            background: linear-gradient(135deg, #ec4899, #9d174d);
            color: white;
            border: 2px solid #fbcfe8;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button.spin-btn:active { transform: scale(0.96); }
        .log-result {
            margin-top: 8px;
            font-size: 11px;
            color: #38bdf8;
            min-height: 28px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="slot-container">
        <h1>🀄 MAHJONG WAYS 5X5</h1>
        
        <div class="info-panel">
            <div>Saldo: <span id="userBalance" style="color: #4ade80; font-weight: bold;">Memuat...</span></div>
            <div>Free Spin: <span id="freeSpinCount" style="color: #60a5fa; font-weight: bold;">0</span></div>
            <div>Multi: <span id="multiplier" class="multiplier-badge">1x</span></div>
        </div>

        <div class="bet-control-panel">
            <button class="bet-btn-pm" onclick="adjustBet(-1)">-</button>
            <div>
                <div style="font-size: 9px; color: #94a3b8;">NILAI TARUHAN (BET)</div>
                <div class="bet-display" id="betDisplay">Rp 400</div>
            </div>
            <button class="bet-btn-pm" onclick="adjustBet(1)">+</button>
        </div>

        <div class="slot-grid" id="slotGrid">
            <script>
                let defHtml = '';
                for(let i=0; i<25; i++) defHtml += '<div class="tile">🀄</div>';
                document.write(defHtml);
            </script>
        </div>

        <button class="spin-btn" id="spinButton" onclick="spinSlot()">MEMUAT DATABASE...</button>

        <div class="log-result" id="logResult">
            Menghubungkan ke MongoDB Bot...
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let telegramId = tg.initDataUnsafe?.user?.id ? tg.initDataUnsafe.user.id.toString() : "123456789";

        // Link domain Pterodactyl kamu yang terhubung ke server Express bot
        const apiUrl = "https://anoshentai.shopryzen.my.id:2002/api/game";

        let currentBalance = 0;
        let currentMultiplier = 1;
        let freeSpinsLeft = 0;

        const betLevels = [400, 800, 1200, 2000, 4000, 10000, 20000, 50000];
        let betIndex = 0;

        const symbols = ["🀄", "🐉", "🀫", "🀀", "🀁", "🀂", "🀃", "🀄", "🐉"];
        const scatterSymbol = "🧧";

        async function fetchBalance() {
            try {
                let res = await fetch(`${apiUrl}?telegramId=${telegramId}`);
                let data = await res.json();
                if (data.success) {
                    currentBalance = data.balance;
                    document.getElementById('userBalance').innerText = "Rp " + currentBalance.toLocaleString('id-ID');
                    document.getElementById('spinButton').innerText = `PUTAR (BET Rp ${betLevels[betIndex].toLocaleString('id-ID')})`;
                    document.getElementById('logResult').innerText = "Berhasil terhubung ke MongoDB Atlas!";
                } else {
                    document.getElementById('logResult').innerText = "❌ Gagal memuat saldo.";
                }
            } catch (e) {
                console.error(e);
                document.getElementById('logResult').innerText = "❌ Gangguan koneksi ke bot.";
            }
        }

        fetchBalance();

        function adjustBet(direction) {
            if (freeSpinsLeft > 0) return;
            betIndex += direction;
            if (betIndex < 0) betIndex = 0;
            if (betIndex >= betLevels.length) betIndex = betLevels.length - 1;

            let activeBet = betLevels[betIndex];
            document.getElementById('betDisplay').innerText = "Rp " + activeBet.toLocaleString('id-ID');
            document.getElementById('spinButton').innerText = `PUTAR (BET Rp ${activeBet.toLocaleString('id-ID')})`;
        }

        async function spinSlot() {
            let currentBet = betLevels[betIndex];
            let isFreeSpinActive = freeSpinsLeft > 0;
            const logEl = document.getElementById('logResult');
            const balanceEl = document.getElementById('userBalance');

            if (!isFreeSpinActive && currentBalance < currentBet) {
                logEl.innerHTML = "❌ Saldo tidak cukup! Yuk top-up dulu.";
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            if (isFreeSpinActive) {
                freeSpinsLeft--;
                document.getElementById('freeSpinCount').innerText = freeSpinsLeft;
            }

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            let counter = 0;
            let spinInterval = setInterval(() => {
                let htmlContent = '';
                for(let i=0; i<25; i++) {
                    let randSym = symbols[Math.floor(Math.random() * symbols.length)];
                    htmlContent += `<div class="tile">${randSym}</div>`;
                }
                document.getElementById('slotGrid').innerHTML = htmlContent;
                counter++;

                if(counter > 7) {
                    clearInterval(spinInterval);
                    processGameResult(isFreeSpinActive, currentBet);
                }
            }, 70);
        }

        async function processGameResult(isFreeSpinActive, currentBet) {
            const logEl = document.getElementById('logResult');
            const balanceEl = document.getElementById('userBalance');
            let randRoll = Math.random();
            let reward = 0;
            let message = "";
            let tileClasses = [];

            for(let i=0; i<25; i++) {
                let isScatter = Math.random() < 0.05;
                let sym = isScatter ? scatterSymbol : symbols[Math.floor(Math.random() * symbols.length)];
                let isGold = (!isScatter && Math.random() < 0.15) ? 'gold' : '';
                let cssClass = isScatter ? 'scatter' : isGold;
                tileClasses.push({sym, cssClass});
            }

            let scattersFound = tileClasses.filter(t => t.sym === scatterSymbol).length;

            if (scattersFound >= 3) {
                freeSpinsLeft += 10;
                currentMultiplier *= 2;
                document.getElementById('freeSpinCount').innerText = freeSpinsLeft;
                document.getElementById('multiplier').innerText = currentMultiplier + "x";
                message = `🎉 JACKPOT SCATTER! +10x Free Spin & Perkalian Naik ${currentMultiplier}x!`;
                reward = 0;
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                let winChanceMultiplier = isFreeSpinActive ? 2.5 : 1; 

                if (randRoll < (0.04 * winChanceMultiplier)) {
                    reward = (currentBet * 3) * currentMultiplier;
                    message = `✨ Mega Win! Menang Rp ${reward.toLocaleString('id-ID')}`;
                } else if (randRoll < (0.20 * winChanceMultiplier)) {
                    reward = (currentBet * 1) * currentMultiplier;
                    message = `🪙 Kemenangan Ubin Emas!`;
                } else {
                    reward = 0;
                    message = isFreeSpinActive ? `😢 Putaran gratis zonk.` : `💀 Rungkad! Saldo masuk ke bandar.`;
                }
            }

            try {
                let response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegramId: telegramId,
                        action: 'spin',
                        bet: isFreeSpinActive ? 0 : currentBet,
                        winAmount: reward
                    })
                });
                let result = await response.json();
                if (result.success) {
                    currentBalance = result.balance;
                    balanceEl.innerText = "Rp " + currentBalance.toLocaleString('id-ID');
                }
            } catch (err) {
                console.error("Gagal update database:", err);
            }

            if (reward > 0) {
                logEl.innerHTML = `<b>${message}</b><br><span style="color: #4ade80;">+Rp ${reward.toLocaleString('id-ID')}</span>`;
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                logEl.innerHTML = `<span style="color: #f87171;">${message}</span>`;
            }

            let finalHtml = '';
            for(let t of tileClasses) {
                finalHtml += `<div class="tile ${t.cssClass}">${t.sym}</div>`;
            }
            document.getElementById('slotGrid').innerHTML = finalHtml;
        }
    </script>
</body>
</html>
